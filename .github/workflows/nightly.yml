name: nightly-videos

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC = 1:00 am Sydney (AEDT). Change to '0 15 * * *' when daylight saving ends.
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to make videos for (YYYY-MM-DD, blank = today in Sydney)'
        required: false
      only:
        description: 'Only these slots, e.g. A1,B3 (blank = all 6)'
        required: false

permissions:
  contents: write # to save state/used.json (topics + clips already used)

concurrency:
  group: nightly-videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System packages (ffmpeg, emoji font)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji

      - run: npm ci

      - name: Headless browser for Remotion
        run: npx remotion browser ensure

      - name: Make the videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.VOICE_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DW_ARCHIVE_KEY: ${{ secrets.DW_ARCHIVE_KEY }}
          DW_LOCK: '1'
          RENDER_CONCURRENCY: '2'
        run: |
          ARGS="${{ inputs.date }}"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          node tools/nightly.mjs $ARGS

      - name: Upload password-locked videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: output/*/locked/
          retention-days: 7
          if-no-files-found: warn

      - name: Save what was used (so nothing repeats)
        if: always()
        run: |
          git config user.name "dropsworth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/used.json || true
          git diff --cached --quiet || (git commit -m "Nightly: update used topics and clips" && git push)
